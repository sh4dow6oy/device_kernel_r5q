name: Galaxy S10 Lite (SM-G770F) Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/device_kernel_r5q
          ref: oneui
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            device-tree-compiler libelf-dev cmake libdw-dev pahole

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz
          mkdir llvm-22; cd llvm-22
          tar -xf ../llvm.tar.gz
          rm ../llvm.tar.gz

      # -----------------------------------------------------------------------
      # PAHOLE v1.25 (Păstrat pentru suport BTF / eBPF)
      # -----------------------------------------------------------------------
      - name: Build Updated Pahole
        run: |
          git clone --recursive https://git.kernel.org/pub/scm/devel/pahole/pahole.git
          cd pahole
          mkdir build
          cd build
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          sudo make install
          cd ../.. && rm -rf pahole
          pahole --version

      # -----------------------------------------------------------------------
      # Build DTC modern
      # -----------------------------------------------------------------------
      - name: Build New DTC
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/utils/dtc/dtc.git ~/dtc
          cd ~/dtc
          make -j$(nproc)

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/AlfCraft07/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          #! /sbin/sh
          # AnyKernel3 Script for R5Q

          properties() { '
          kernel.string=sh4dow6oy Kernel for r5q platform - Built for r5q (SM-G770F)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=r5q
          device.name2=r5q
          device.name3=SM-G770F
          device.name4=r5q
          supported.versions=11-16
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          boot_img_hdr_ver=2

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # COMPILARE KERNEL (DOAR IMAGE)
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/llvm-22/bin:~/dtc:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          export LLVM=1
          export LLVM_IAS=1

          rm -rf out && mkdir -p out

          echo "--> Generating Base Config: r5q_eur_open_defconfig"
          make O=out r5q_eur_open_defconfig

          # Injectare opțiuni BTF pentru eBPF
          echo "CONFIG_DEBUG_INFO_BTF=y" >> out/.config
          echo "CONFIG_DEBUG_INFO_BTF_MODULES=y" >> out/.config
          make O=out olddefconfig

          echo "--> Compiling Uncompressed Kernel Image..."
          set -o pipefail
          make O=out -j$(nproc) Image 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image .
             echo "✓ Copied Image"
          else
             echo "Build Failed: Image file not found"
             exit 1
          fi

          ZIPNAME="sh4dow6oy-r5q-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "✓ Created $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
